<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vissionaries of Purpose — 2026 Gig Guide</title>
  <style>
    :root {
      --stage-black: #050505;
      --executive-black: #0c0a0a;
      --soft-white: #f4f1ed;
      --muted: #b6aca5;
      --crimson: #d01f2e;
      --gold: #c59a3a;
      --graphite: #343032;
      --line: rgba(244, 241, 237, 0.34);
      --radius: 18px;
      --max-width: 1180px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      color-scheme: dark;
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 50% 12%, rgba(104, 16, 25, 0.2), transparent 30rem),
        var(--stage-black);
      color: var(--soft-white);
      font-family: Arial, Helvetica, sans-serif;
    }

    button,
    a {
      font: inherit;
    }

    button:focus-visible,
    a:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 4px;
    }

    .gig-guide {
      width: min(calc(100% - 32px), var(--max-width));
      margin: 0 auto;
      padding: 56px 0 100px;
    }

    .gig-guide__header {
      text-align: center;
      margin-bottom: 58px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      min-height: 32px;
      padding: 7px 14px;
      border: 1px solid rgba(244, 241, 237, 0.7);
      border-radius: 999px;
      color: var(--soft-white);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 22px 0 10px;
      font-size: clamp(3rem, 8vw, 7.2rem);
      line-height: 0.9;
      letter-spacing: -0.055em;
      text-transform: uppercase;
    }

    .intro {
      max-width: 650px;
      margin: 0 auto;
      color: var(--muted);
      line-height: 1.65;
    }

    .timeline {
      position: relative;
      display: grid;
      gap: 52px;
      padding: 12px 0;
    }

    .timeline::before {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 1px;
      background: linear-gradient(
        to bottom,
        transparent,
        var(--line) 6%,
        var(--line) 94%,
        transparent
      );
      transform: translateX(-50%);
    }

    .timeline-item {
      position: relative;
      display: grid;
      grid-template-columns: 1fr 88px 1fr;
      align-items: center;
      min-height: 190px;
    }

    .timeline-item:nth-child(4n + 2) {
      transform: translateY(26px);
    }

    .timeline-item:nth-child(4n + 3) {
      transform: translateY(-8px);
    }

    .timeline-item__branch {
      position: relative;
      grid-column: 2;
      height: 1px;
      background: var(--line);
    }

    .timeline-item__branch::after {
      content: "";
      position: absolute;
      top: 50%;
      width: 9px;
      height: 9px;
      border: 1px solid var(--gold);
      border-radius: 50%;
      background: var(--stage-black);
      transform: translateY(-50%);
    }

    .timeline-item--left .timeline-item__branch::after {
      right: -5px;
    }

    .timeline-item--right .timeline-item__branch::after {
      left: -5px;
    }

    .gig-card {
      position: relative;
      width: min(100%, 430px);
      min-height: 170px;
      padding: 24px;
      border: 1px solid rgba(244, 241, 237, 0.55);
      border-radius: var(--radius);
      background:
        linear-gradient(145deg, rgba(255, 255, 255, 0.035), rgba(255, 255, 255, 0.004)),
        var(--executive-black);
      box-shadow:
        14px 14px 38px rgba(0, 0, 0, 0.45),
        inset 1px 1px 0 rgba(255, 255, 255, 0.05);
      color: inherit;
      text-align: left;
      cursor: pointer;
      transition:
        transform 180ms ease,
        border-color 180ms ease,
        background-color 180ms ease;
    }

    .timeline-item--left .gig-card {
      grid-column: 1;
      justify-self: end;
    }

    .timeline-item--right .gig-card {
      grid-column: 3;
      justify-self: start;
      order: 3;
    }

    .timeline-item--right .timeline-item__branch {
      order: 2;
    }

    .gig-card:hover {
      transform: translateY(-4px);
      border-color: rgba(197, 154, 58, 0.85);
    }

    .gig-card__index {
      display: block;
      margin-bottom: 32px;
      color: var(--gold);
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    .gig-card__date {
      display: block;
      margin-bottom: 10px;
      color: var(--muted);
      font-size: 0.74rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .gig-card__title {
      display: block;
      font-size: clamp(1.25rem, 2.2vw, 1.85rem);
      font-weight: 900;
      line-height: 1.05;
      text-transform: uppercase;
    }

    .gig-card__meta {
      display: block;
      margin-top: 12px;
      color: var(--muted);
      font-size: 0.88rem;
      line-height: 1.45;
    }

    .gig-card__action {
      position: absolute;
      right: 18px;
      bottom: 18px;
      display: inline-flex;
      align-items: center;
      min-height: 34px;
      padding: 7px 12px;
      border: 1px solid rgba(244, 241, 237, 0.55);
      border-radius: 999px;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .empty-state {
      color: var(--muted);
      text-align: center;
    }

    .dialog-backdrop {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: grid;
      place-items: center;
      padding: 18px;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(10px);
      opacity: 0;
      visibility: hidden;
      transition:
        opacity 180ms ease,
        visibility 180ms ease;
    }

    .dialog-backdrop.is-open {
      opacity: 1;
      visibility: visible;
    }

    .event-dialog {
      width: min(100%, 980px);
      max-height: min(90vh, 860px);
      overflow: auto;
      border: 1px solid rgba(244, 241, 237, 0.48);
      border-radius: 24px;
      background: var(--executive-black);
      box-shadow: 0 30px 100px rgba(0, 0, 0, 0.72);
      transform: translateY(18px) scale(0.99);
      transition: transform 180ms ease;
    }

    .dialog-backdrop.is-open .event-dialog {
      transform: translateY(0) scale(1);
    }

    .event-dialog__grid {
      display: grid;
      grid-template-columns: minmax(280px, 0.9fr) minmax(320px, 1.1fr);
      min-height: 560px;
    }

    .event-dialog__visual {
      position: relative;
      min-height: 420px;
      overflow: hidden;
      border-radius: 23px 0 0 23px;
      background:
        linear-gradient(155deg, rgba(208, 31, 46, 0.8), rgba(5, 5, 5, 0.18) 56%),
        linear-gradient(35deg, #27060a, #0d0b0b);
    }

    .event-dialog__visual img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .event-dialog__poster-fallback {
      position: absolute;
      inset: 0;
      display: grid;
      align-content: end;
      padding: 32px;
      background:
        linear-gradient(to top, rgba(0, 0, 0, 0.82), transparent 62%),
        repeating-linear-gradient(
          120deg,
          transparent 0 34px,
          rgba(255, 255, 255, 0.025) 34px 35px
        );
    }

    .event-dialog__poster-fallback span {
      max-width: 11ch;
      font-size: clamp(2.3rem, 6vw, 5rem);
      font-weight: 900;
      line-height: 0.88;
      letter-spacing: -0.06em;
      text-transform: uppercase;
    }

    .event-dialog__content {
      position: relative;
      padding: 44px;
    }

    .dialog-close {
      position: absolute;
      top: 18px;
      right: 18px;
      width: 42px;
      height: 42px;
      border: 1px solid rgba(244, 241, 237, 0.45);
      border-radius: 50%;
      background: transparent;
      color: var(--soft-white);
      cursor: pointer;
    }

    .event-kicker {
      margin: 0 54px 18px 0;
      color: var(--gold);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    .event-title {
      margin: 0;
      font-size: clamp(2.2rem, 6vw, 5rem);
      line-height: 0.9;
      letter-spacing: -0.055em;
      text-transform: uppercase;
    }

    .event-artist {
      margin: 15px 0 28px;
      color: var(--muted);
      font-size: 1.06rem;
    }

    .event-facts {
      display: grid;
      gap: 15px;
      margin: 0 0 28px;
    }

    .event-fact {
      display: grid;
      grid-template-columns: 92px 1fr;
      gap: 16px;
      padding-bottom: 14px;
      border-bottom: 1px solid rgba(244, 241, 237, 0.12);
    }

    .event-fact dt {
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .event-fact dd {
      margin: 0;
      line-height: 1.45;
    }

    .event-description {
      color: var(--muted);
      line-height: 1.7;
    }

    .event-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 30px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 46px;
      padding: 11px 18px;
      border: 1px solid rgba(244, 241, 237, 0.55);
      border-radius: 999px;
      background: transparent;
      color: var(--soft-white);
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-decoration: none;
      text-transform: uppercase;
      cursor: pointer;
    }

    .button--primary {
      border-color: var(--crimson);
      background: var(--crimson);
    }

    .button[hidden] {
      display: none;
    }

    body.dialog-open {
      overflow: hidden;
    }

    @media (max-width: 760px) {
      .gig-guide {
        width: min(calc(100% - 24px), var(--max-width));
        padding-top: 36px;
      }

      .timeline {
        gap: 26px;
      }

      .timeline::before {
        left: 14px;
        transform: none;
      }

      .timeline-item,
      .timeline-item:nth-child(n) {
        grid-template-columns: 28px 1fr;
        min-height: 0;
        transform: none;
      }

      .timeline-item__branch,
      .timeline-item--right .timeline-item__branch {
        grid-column: 1;
        grid-row: 1;
        width: 28px;
        order: initial;
      }

      .timeline-item__branch::after,
      .timeline-item--left .timeline-item__branch::after,
      .timeline-item--right .timeline-item__branch::after {
        right: auto;
        left: 9px;
      }

      .timeline-item--left .gig-card,
      .timeline-item--right .gig-card {
        grid-column: 2;
        grid-row: 1;
        width: 100%;
        justify-self: stretch;
        order: initial;
      }

      .event-dialog {
        max-height: 94vh;
      }

      .event-dialog__grid {
        grid-template-columns: 1fr;
      }

      .event-dialog__visual {
        min-height: 310px;
        border-radius: 23px 23px 0 0;
      }

      .event-dialog__content {
        padding: 32px 22px 28px;
      }

      .event-fact {
        grid-template-columns: 76px 1fr;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body>
  <main class="gig-guide">
    <header class="gig-guide__header">
      <span class="eyebrow">Upcoming gigs · 2026</span>
      <h1>Gig Guide</h1>
      <p class="intro">
        Follow the line through the performances ahead. Select an event to see
        the full details, save it to your calendar or secure a ticket.
      </p>
    </header>

    <section id="timeline" class="timeline" aria-label="Upcoming events"></section>
  </main>

  <div id="dialogBackdrop" class="dialog-backdrop" hidden>
    <article
      id="eventDialog"
      class="event-dialog"
      role="dialog"
      aria-modal="true"
      aria-labelledby="dialogTitle"
      aria-describedby="dialogDescription"
    >
      <div class="event-dialog__grid">
        <div id="dialogVisual" class="event-dialog__visual">
          <img id="dialogImage" alt="" hidden>
          <div id="posterFallback" class="event-dialog__poster-fallback">
            <span id="posterFallbackTitle"></span>
          </div>
        </div>

        <div class="event-dialog__content">
          <button id="closeDialog" class="dialog-close" type="button" aria-label="Close event details">×</button>

          <p id="dialogKicker" class="event-kicker"></p>
          <h2 id="dialogTitle" class="event-title"></h2>
          <p id="dialogArtist" class="event-artist"></p>

          <dl class="event-facts">
            <div class="event-fact">
              <dt>Date</dt>
              <dd id="dialogDate"></dd>
            </div>
            <div class="event-fact">
              <dt>Time</dt>
              <dd id="dialogTime"></dd>
            </div>
            <div class="event-fact">
              <dt>Venue</dt>
              <dd id="dialogVenue"></dd>
            </div>
          </dl>

          <p id="dialogDescription" class="event-description"></p>

          <div class="event-actions">
            <button id="calendarButton" class="button button--primary" type="button">
              Add to Calendar
            </button>
            <a id="ticketsButton" class="button" target="_blank" rel="noopener noreferrer">
              Get Tickets
            </a>
            <a id="locationButton" class="button" target="_blank" rel="noopener noreferrer">
              View Location
            </a>
          </div>
        </div>
      </div>
    </article>
  </div>

  <script>
    /*
      Replace these sample objects with the real Vissionaries of Purpose event data.
      A missing ticketUrl automatically removes the Get Tickets button.
    */
    const events = [
      {
        id: "event-01",
        slug: "event-title-one",
        title: "Event Title One",
        theme: "Event theme",
        artist: "Featured artist",
        start: "2026-09-12T18:00:00+02:00",
        end: "2026-09-12T21:00:00+02:00",
        venue: "Venue name",
        city: "City, Province",
        description: "Replace this text with the full event description, programme information and anything visitors should know before arriving.",
        image: "",
        ticketUrl: "https://example.com/tickets",
        mapsUrl: "https://maps.google.com/?q=South+Africa",
        eventUrl: ""
      },
      {
        id: "event-02",
        slug: "event-title-two",
        title: "Event Title Two",
        theme: "Event theme",
        artist: "Featured artist",
        start: "2026-10-03T17:00:00+02:00",
        end: "2026-10-03T20:00:00+02:00",
        venue: "Venue name",
        city: "City, Province",
        description: "This sample has no ticket link. The Get Tickets action will therefore be hidden while Add to Calendar remains available.",
        image: "",
        ticketUrl: "",
        mapsUrl: "https://maps.google.com/?q=South+Africa",
        eventUrl: ""
      },
      {
        id: "event-03",
        slug: "event-title-three",
        title: "Event Title Three",
        theme: "Event theme",
        artist: "Featured artist",
        start: "2026-11-14T18:30:00+02:00",
        end: "2026-11-14T21:30:00+02:00",
        venue: "Venue name",
        city: "City, Province",
        description: "Use this area for natural promotional copy, venue requirements, arrival information and the performance context.",
        image: "",
        ticketUrl: "",
        mapsUrl: "",
        eventUrl: ""
      },
      {
        id: "event-04",
        slug: "event-title-four",
        title: "Event Title Four",
        theme: "Event theme",
        artist: "Featured artist",
        start: "2026-12-05T16:00:00+02:00",
        end: "2026-12-05T20:00:00+02:00",
        venue: "Venue name",
        city: "City, Province",
        description: "Every event can use a different poster while retaining the same event-detail structure and action logic.",
        image: "",
        ticketUrl: "https://example.com/tickets",
        mapsUrl: "https://maps.google.com/?q=South+Africa",
        eventUrl: ""
      }
    ];

    const timeline = document.querySelector("#timeline");
    const dialogBackdrop = document.querySelector("#dialogBackdrop");
    const eventDialog = document.querySelector("#eventDialog");
    const closeDialogButton = document.querySelector("#closeDialog");
    const calendarButton = document.querySelector("#calendarButton");
    const ticketsButton = document.querySelector("#ticketsButton");
    const locationButton = document.querySelector("#locationButton");
    const dialogImage = document.querySelector("#dialogImage");
    const posterFallback = document.querySelector("#posterFallback");

    let activeEvent = null;
    let previouslyFocusedElement = null;

    const dateFormatter = new Intl.DateTimeFormat("en-ZA", {
      day: "2-digit",
      month: "short",
      year: "numeric",
      timeZone: "Africa/Johannesburg"
    });

    const longDateFormatter = new Intl.DateTimeFormat("en-ZA", {
      weekday: "long",
      day: "numeric",
      month: "long",
      year: "numeric",
      timeZone: "Africa/Johannesburg"
    });

    const timeFormatter = new Intl.DateTimeFormat("en-ZA", {
      hour: "2-digit",
      minute: "2-digit",
      timeZone: "Africa/Johannesburg"
    });

    function renderEvents() {
      const sortedEvents = [...events].sort(
        (a, b) => new Date(a.start) - new Date(b.start)
      );

      if (!sortedEvents.length) {
        timeline.innerHTML = '<p class="empty-state">No upcoming events have been published yet.</p>';
        return;
      }

      timeline.innerHTML = sortedEvents.map((event, index) => {
        const side = index % 2 === 0 ? "left" : "right";
        const date = dateFormatter.format(new Date(event.start)).toUpperCase();
        const location = [event.venue, event.city].filter(Boolean).join(" · ");

        return `
          <article class="timeline-item timeline-item--${side}">
            ${side === "right" ? '<span class="timeline-item__branch" aria-hidden="true"></span>' : ""}
            <button
              class="gig-card"
              type="button"
              data-event-id="${event.id}"
              aria-label="View details for ${escapeHTML(event.title)}"
            >
              <span class="gig-card__index">${String(index + 1).padStart(2, "0")} · 2026</span>
              <time class="gig-card__date" datetime="${event.start}">${date}</time>
              <span class="gig-card__title">${escapeHTML(event.title)}</span>
              <span class="gig-card__meta">${escapeHTML(event.artist)}${location ? ` · ${escapeHTML(location)}` : ""}</span>
              <span class="gig-card__action">View event</span>
            </button>
            ${side === "left" ? '<span class="timeline-item__branch" aria-hidden="true"></span>' : ""}
          </article>
        `;
      }).join("");

      timeline.querySelectorAll(".gig-card").forEach((card) => {
        card.addEventListener("click", () => {
          const event = sortedEvents.find((item) => item.id === card.dataset.eventId);
          openEventDialog(event, card);
        });
      });
    }

    function openEventDialog(event, trigger) {
      if (!event) return;

      activeEvent = event;
      previouslyFocusedElement = trigger;

      document.querySelector("#dialogKicker").textContent =
        [event.theme, "2026 Gig Guide"].filter(Boolean).join(" · ");
      document.querySelector("#dialogTitle").textContent = event.title;
      document.querySelector("#dialogArtist").textContent = event.artist;
      document.querySelector("#dialogDate").textContent =
        longDateFormatter.format(new Date(event.start));
      document.querySelector("#dialogTime").textContent =
        `${timeFormatter.format(new Date(event.start))} – ${timeFormatter.format(new Date(event.end))}`;
      document.querySelector("#dialogVenue").textContent =
        [event.venue, event.city].filter(Boolean).join(", ");
      document.querySelector("#dialogDescription").textContent = event.description;
      document.querySelector("#posterFallbackTitle").textContent = event.title;

      if (event.image) {
        dialogImage.src = event.image;
        dialogImage.alt = `${event.title} event poster`;
        dialogImage.hidden = false;
        posterFallback.hidden = true;
      } else {
        dialogImage.hidden = true;
        dialogImage.removeAttribute("src");
        dialogImage.alt = "";
        posterFallback.hidden = false;
      }

      configureLink(ticketsButton, event.ticketUrl);
      configureLink(locationButton, event.mapsUrl);

      dialogBackdrop.hidden = false;
      requestAnimationFrame(() => {
        dialogBackdrop.classList.add("is-open");
      });

      document.body.classList.add("dialog-open");
      closeDialogButton.focus();
    }

    function closeEventDialog() {
      dialogBackdrop.classList.remove("is-open");
      document.body.classList.remove("dialog-open");

      window.setTimeout(() => {
        dialogBackdrop.hidden = true;
        activeEvent = null;
        previouslyFocusedElement?.focus();
      }, 180);
    }

    function configureLink(element, url) {
      if (url) {
        element.href = url;
        element.hidden = false;
      } else {
        element.hidden = true;
        element.removeAttribute("href");
      }
    }

    function escapeICS(value = "") {
      return String(value)
        .replace(/\\/g, "\\\\")
        .replace(/\n/g, "\\n")
        .replace(/,/g, "\\,")
        .replace(/;/g, "\\;");
    }

    function toICSDate(isoDate) {
      return new Date(isoDate)
        .toISOString()
        .replace(/[-:]/g, "")
        .replace(/\.\d{3}Z$/, "Z");
    }

    function downloadCalendarEvent(event) {
      if (!event?.start || !event?.end) return;

      const uid = `${event.id}-${Date.now()}@vissionariesofpurpose.co.za`;
      const location = [event.venue, event.city].filter(Boolean).join(", ");

      const ics = [
        "BEGIN:VCALENDAR",
        "VERSION:2.0",
        "PRODID:-//Vissionaries of Purpose//Gig Guide//EN",
        "CALSCALE:GREGORIAN",
        "METHOD:PUBLISH",
        "BEGIN:VEVENT",
        `UID:${uid}`,
        `DTSTAMP:${toICSDate(new Date().toISOString())}`,
        `DTSTART:${toICSDate(event.start)}`,
        `DTEND:${toICSDate(event.end)}`,
        `SUMMARY:${escapeICS(event.title)}`,
        `DESCRIPTION:${escapeICS(event.description)}`,
        `LOCATION:${escapeICS(location)}`,
        event.eventUrl ? `URL:${escapeICS(event.eventUrl)}` : "",
        "END:VEVENT",
        "END:VCALENDAR"
      ].filter(Boolean).join("\r\n");

      const blob = new Blob([ics], {
        type: "text/calendar;charset=utf-8"
      });

      const fileUrl = URL.createObjectURL(blob);
      const link = document.createElement("a");

      link.href = fileUrl;
      link.download = `${event.slug || event.id}.ics`;
      document.body.appendChild(link);
      link.click();
      link.remove();

      URL.revokeObjectURL(fileUrl);
    }

    function escapeHTML(value = "") {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    calendarButton.addEventListener("click", () => {
      downloadCalendarEvent(activeEvent);
    });

    closeDialogButton.addEventListener("click", closeEventDialog);

    dialogBackdrop.addEventListener("click", (event) => {
      if (event.target === dialogBackdrop) closeEventDialog();
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && !dialogBackdrop.hidden) {
        closeEventDialog();
      }

      if (event.key === "Tab" && !dialogBackdrop.hidden) {
        const focusable = [...eventDialog.querySelectorAll(
          'button:not([hidden]), a[href]:not([hidden]), [tabindex]:not([tabindex="-1"])'
        )].filter((element) => !element.disabled);

        if (!focusable.length) return;

        const first = focusable[0];
        const last = focusable[focusable.length - 1];

        if (event.shiftKey && document.activeElement === first) {
          event.preventDefault();
          last.focus();
        } else if (!event.shiftKey && document.activeElement === last) {
          event.preventDefault();
          first.focus();
        }
      }
    });

    renderEvents();
  </script>
</body>
</html>
